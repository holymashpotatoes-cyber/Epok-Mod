name: Build Epok Mod
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Extract Epok project
        run: unzip -q epok-neoforge-build-project.zip -d project
      - name: Build mod
        working-directory: project/epic_src
        run: gradle --no-daemon clean build
      - name: Upload finished mod
        uses: actions/upload-artifact@v4
        with:
          name: Epok-Mod-JAR
          path: project/epic_src/build/libs/*.jar
